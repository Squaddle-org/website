# Replaces nginxinc/nginx-unprivileged's default server block (see Dockerfile).
# No $remote_addr anywhere in the log format - CLAUDE.md / privacy policy both promise
# "server logs without IP addresses".
log_format noip '$time_iso8601 "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout noip;

    # website/CLAUDE.md's required header set, applied site-wide (incl. /j/* and error pages -
    # "always" so they're sent even on 404/50x responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # website/CLAUDE.md: "all /j/* -> /j/index.html". Internal rewrite only (no redirect), so
    # the URL - and the fragment the browser never sends anyway - never changes.
    location /j/ {
        try_files $uri /j/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
